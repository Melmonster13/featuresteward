version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node LTS releases; odd-numbered majors never become LTS.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /extensions/vscode
    schedule:
      interval: weekly
    ignore:
      # Stay on the oldest VS Code the extension supports (engines.vscode).
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
