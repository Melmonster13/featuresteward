version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the current Node LTS. A new major starts as a "Current"
      # release and only becomes LTS months later (odd majors never do), so
      # moving to the next LTS is a manual change to the Dockerfile and CI.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /extensions/vscode
    schedule:
      interval: weekly
    ignore:
      # Stay on the oldest VS Code the extension supports (engines.vscode).
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
